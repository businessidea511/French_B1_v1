<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PolyLearn French - Advanced B1 Learning with AI Multi-Language Translation">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#E0604A">
  <meta name="apple-mobile-web-app-title" content="PolyLearn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>PolyLearn French</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #FBF7F0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #2E2B3A;
      font-family: 'Segoe UI', 'Inter', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      body { background-color: #1C1F2B; color: #ECE8E1; }
    }

    .logo {
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
      animation: float 2.4s ease-in-out infinite;
      filter: drop-shadow(0 12px 24px rgba(224, 96, 74, 0.35));
    }

    @keyframes float {
      50% { transform: translateY(-10px) rotate(-4deg); }
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spinner {
      width: 50px;
      height: 50px;
      width: 36px;
      height: 36px;
      border: 4px solid rgba(224, 96, 74, 0.15);
      border-top-color: #E0604A;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Offline support: keeps a copy of the app so it opens without internet.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Offline mode unavailable', e));
    }
  </script>

  <script>
    // PWA Install Logic
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent Chrome 67 and earlier from automatically showing the prompt
      e.preventDefault();
      // Stash the event so it can be triggered later.
      window.deferredPrompt = e;
      console.log('📦 PWA Install Prompt captured');
      
      // Notify Flutter that install is available
      if (window.onAppInstallable) {
        window.onAppInstallable();
      }
    });

    window.installPWA = async () => {
      if (!window.deferredPrompt) {
        console.log('❌ No install prompt available');
        return false;
      }
      // Show the prompt
      window.deferredPrompt.prompt();
      // Wait for the user to respond to the prompt
      const { outcome } = await window.deferredPrompt.userChoice;
      console.log(`👤 User response to install prompt: ${outcome}`);
      // We've used the prompt, and can't use it again, throw it away
      window.deferredPrompt = null;
      return outcome === 'accepted';
    };

    window.addEventListener('appinstalled', (evt) => {
      console.log('✅ App installed successfully');
    });
  </script>
</head>

<body>
  <div class="loading">
    <img class="logo" src="icons/Icon-192.png" alt="PolyLearn">
    <div class="spinner"></div>
    <p>Chargement du cours...</p>
  </div>
</body>

</html>
